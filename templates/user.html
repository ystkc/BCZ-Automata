  <script>
    let phone_number_input = document.getElementById('phone_number');
    let code_input = document.getElementById('code');
    let send_sms = document.getElementById('send_sms');
    let login_btn = document.getElementById('login_btn');
    window.onload = ()=>{
      let userData = JSON.parse(localStorage.getItem('userData'));
      document.querySelector('.member-info').innerHTML = '你的用户ID为: ' + userData.user_id + '<br>你的授权令牌为: ' + userData.token + '<br>请立即复制以免丢失';
      localStorage.removeItem('userData');
    }

    // 发送短信验证码
    function sendSms(phone) {
      let payload = {'phone': phone};
      fetchAPI('send_sms', 'POST', payload);
    }

    // 用户登陆
    function userLogin(phone, code) {
      let payload = {'phone': phone, 'code': code};
      return fetchAPI('user_login', 'POST', payload);
    }

</script>
