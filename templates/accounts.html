<!DOCTYPE html>
<!-- 多账号管理系统 -->
<head>
    <style>
        .squares {
            display: grid;
            grid-template-columns: repeat(7, 20px);
            grid-gap: 3px;
        }
        .square {
            width: 18px;
            height: 18px;
        }
        .green {
            background-color: green;
        }
        .gray {
            background-color: gray;
        }
        .transparent {
            background-color: transparent;
        }
        td {
            padding: 10px;
            border: 1px solid #000;
        }
        .dropzone {
            background-color: wheat;
            opacity: 75%;
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 20px;
            right: 20px;
            width: 50%;
            height: 50%;
            text-align: center;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            border: 2px dashed #ccc;
            border-radius: 10px;
        }
        .dropzone.highlight {
            border-color: purple;
        }
    </style>
</head>
<body>
    <div class="dropzone" id="dropzone" style="display:none;" onclick="this.style.display='none';"></div>
    <div>
        <div>账号列表</div><li>小技巧：在昵称或公告中加入"下次互动字母A"可以将A开头昵称用户前置显示</li>
        <button onclick="refresh(this)">查看打卡情况</button>
        <button onclick="buKa(this)">未打卡的打卡</button>
        <button onclick="connect_ws(this)">重新连接服务器</button>
        <div id="info"></div>
        <button onclick="joinAll(this)">全部加入</button>
        <button onclick="reloadAll(this)">重载账号列表</button>
        <button onclick="updateNotice(this)">重新计算违禁词表</button>
        <button onclick="exportBlacklist()">重新导出黑名单</button>
        <button onclick="redirectToGroups()">转到groups</button>
        <button onclick="redirectToNotices()">转到notices</button>

        <div class="account-list">

        </div>
    </div>
    <script src="lib/accounts.js"></script>
    <!-- socket.io 4.0.0 -->
    <!-- <script src="lib/socket.io.min.js"></script> -->
</body>
